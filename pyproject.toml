[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-mlir-qir"
version = "0.1.0"
description = "Hybrid deterministic + LLM MLIR-to-QIR translator with dual-backend verification"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [
  { name = "Sharmin Afrose" },
  { name = "Vicente Leyton-Ortega" },
  { name = "Narasinga Rao Miniskar" },
  { name = "Elaine Wong" },
  { name = "Travis S. Humble" },
]
keywords = ["quantum", "compiler", "mlir", "qir", "llvm", "agentic", "llm"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
  "Topic :: Software Development :: Compilers",
]

# Core deps. Verification backends and the UI are opt-in extras (below) so
# `pip install agentic-mlir-qir` stays small (deterministic translator only).
dependencies = [
  "numpy>=1.17,<2.0",
  "regex>=2023.0",
  "lark-parser>=0.12.0",
  "python-dotenv>=1.0.0",
  "pydantic>=2.6.1,<3.0.0",
  "pydantic-settings>=2.1.0",
  "rich>=13.7.0",
]

[project.optional-dependencies]
# --- Agentic translation (LLM agents via CrewAI) ---------------------------
agentic = [
  "crewai==1.10.0",
  "crewai-tools==0.1.6",
  "ollama>=0.1.7",
  "langchain>=0.1.10,<0.2.0",
  "langchain-community>=0.0.25,<0.1.0",
]

# --- Verification: QIR runner + Catalyst MLIR-side simulator ---------------
verify = [
  "qirrunner==0.9.1",
  "pennylane==0.44.0",
  "pennylane-catalyst==0.14.0",
  "qiskit==0.46.0",
]

# --- Verification: Quake MLIR-side simulator (NVIDIA CUDA-Q) ---------------
quake = [
  "cuda-quantum==0.13",
]

# --- OpenQASM 2.0/3.0 input frontend (QASM -> Quake MLIR) -------------------
# Qiskit parses the QASM; CUDA-Q rebuilds the circuit and emits Quake MLIR
# that the existing deterministic pipeline translates to QIR.
qasm = [
  "qiskit==0.46.0",
  "qiskit-qasm3-import>=0.6.0",
  "cuda-quantum==0.13",
]

# --- Streamlit demo UI -----------------------------------------------------
ui = [
  "streamlit==1.31.0",
  "plotly==5.18.0",
  "pandas==2.2.0",
]

# --- Development & testing -------------------------------------------------
dev = [
  "pytest==8.0.0",
  "pytest-cov==4.1.0",
]

# --- Convenience: install everything ---------------------------------------
all = [
  "agentic-mlir-qir[agentic,verify,quake,qasm,ui,dev]",
]

[project.scripts]
# Console entry points; both names are preserved for backward compatibility.
agentic-mlir-qir = "agentic_mlir_qir.cli:main"
mlir2qir = "agentic_mlir_qir.cli:main"

[project.urls]
Homepage = "https://github.com/ORNL/agentic-mlir-qir"
Repository = "https://github.com/ORNL/agentic-mlir-qir"
Issues = "https://github.com/ORNL/agentic-mlir-qir/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["agentic_mlir_qir*"]
exclude = ["tests*", "experiments*", "docs*", "venv*"]

[tool.setuptools.package-data]
"agentic_mlir_qir" = ["py.typed", "**/*.md"]
